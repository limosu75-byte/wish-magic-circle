<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120b24" />
  <title>沈叙的许愿魔法阵</title>

  <style>
    :root{
      --bg1:#090612;
      --bg2:#17102b;
      --glass:rgba(255,255,255,.08);
      --line:rgba(255,255,255,.20);
      --text:#f7f2ff;
      --muted:#cfc4df;
      --glow:#d6b8ff;
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;

      color:var(--text);
    }

    body{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:24px;

      overflow-x:hidden;

      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(139,92,246,.22),
          transparent 35%
        ),

        radial-gradient(
          circle at 20% 80%,
          rgba(59,130,246,.13),
          transparent 30%
        ),

        linear-gradient(
          160deg,
          var(--bg2),
          var(--bg1) 60%
        );
    }


    /* 星空背景 */

    .stars,
    .stars:before,
    .stars:after{

      position:fixed;

      inset:0;

      pointer-events:none;

      content:"";

      background-image:

        radial-gradient(
          circle,
          rgba(255,255,255,.9) 1px,
          transparent 1.6px
        ),

        radial-gradient(
          circle,
          rgba(255,255,255,.55) 1px,
          transparent 1.4px
        );

      background-size:
        76px 76px,
        113px 113px;

      background-position:
        0 0,
        31px 22px;

      opacity:.18;

      animation:
        drift 18s linear infinite;
    }


    .stars:before{

      transform:scale(1.25);

      opacity:.10;

      animation-duration:27s;
    }


    .stars:after{

      transform:scale(.8);

      opacity:.12;

      animation-duration:14s;
    }


    @keyframes drift{

      to{

        background-position:
          0 76px,
          31px 135px;
      }
    }



    /* 主页面 */

    .wrap{

      width:min(440px,100%);

      position:relative;

      z-index:2;
    }


    .card{

      border:
        1px solid var(--line);

      border-radius:
        30px;

      padding:
        28px 22px 22px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.10),
          rgba(255,255,255,.055)
        );

      box-shadow:

        0 20px 80px
        rgba(0,0,0,.38),

        inset 0 1px 0
        rgba(255,255,255,.11);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }


    h1{

      font-size:
        24px;

      margin:
        4px 0 4px;

      text-align:center;

      letter-spacing:
        .04em;
    }


    .sub{

      text-align:center;

      color:
        var(--muted);

      font-size:
        13px;

      margin-bottom:
        18px;
    }



    /* 魔法阵 */

    .circle-wrap{

      display:grid;

      place-items:center;

      margin:
        8px 0 20px;

      min-height:
        240px;
    }


    .circle{

      width:
        220px;

      height:
        220px;

      border-radius:
        50%;

      border:
        1px solid rgba(255,255,255,.40);

      position:
        relative;

      display:grid;

      place-items:center;

      box-shadow:

        0 0 35px
        rgba(191,156,255,.28),

        inset 0 0 35px
        rgba(191,156,255,.12);

      transition:
        .4s ease;
    }


    .circle:before,
    .circle:after{

      content:"";

      position:absolute;

      border-radius:
        50%;

      border:
        1px solid rgba(255,255,255,.22);
    }


    .circle:before{

      inset:
        15px;
    }


    .circle:after{

      inset:
        33px;

      border-style:
        dashed;
    }



    .ring{

      position:absolute;

      inset:
        -10px;

      border-radius:
        50%;

      border:
        1px dashed rgba(213,190,255,.44);

      animation:
        spin 13s linear infinite;
    }


    .ring2{

      position:absolute;

      inset:
        28px;

      border-radius:
        50%;

      border:
        1px solid rgba(213,190,255,.18);

      animation:
        spinBack 9s linear infinite;
    }


    @keyframes spin{

      to{

        transform:
          rotate(360deg);
      }
    }


    @keyframes spinBack{

      to{

        transform:
          rotate(-360deg);
      }
    }


    .sigil{

      font-size:
        52px;

      text-shadow:

        0 0 18px
        var(--glow),

        0 0 38px
        rgba(214,184,255,.4);

      animation:
        pulse 2.3s ease-in-out infinite;
    }


    @keyframes pulse{

      50%{

        transform:
          scale(1.08);

        filter:
          brightness(1.2);
      }
    }



    .orbit{

      position:absolute;

      inset:0;

      animation:
        spin 8s linear infinite;
    }


    .orbit span{

      position:absolute;

      font-size:
        18px;
    }


    .orbit span:nth-child(1){

      left:
        50%;

      top:
        -10px;

      transform:
        translateX(-50%);
    }


    .orbit span:nth-child(2){

      right:
        -8px;

      top:
        50%;

      transform:
        translateY(-50%);
    }


    .orbit span:nth-child(3){

      left:
        50%;

      bottom:
        -10px;

      transform:
        translateX(-50%);
    }


    .orbit span:nth-child(4){

      left:
        -8px;

      top:
        50%;

      transform:
        translateY(-50%);
    }



    /* 输入区 */

    .field{

      display:flex;

      gap:
        10px;

      margin:
        4px 0 12px;
    }


    input{

      flex:
        1;

      min-width:
        0;

      padding:
        14px 15px;

      border-radius:
        16px;

      border:
        1px solid rgba(255,255,255,.16);

      background:
        rgba(0,0,0,.18);

      color:
        white;

      font-size:
        16px;

      outline:
        none;
    }


    input::placeholder{

      color:
        #9f95ae;
    }


    input:focus{

      border-color:
        rgba(214,184,255,.6);

      box-shadow:
        0 0 0 3px
        rgba(214,184,255,.08);
    }



    button{

      border:
        0;

      border-radius:
        16px;

      padding:
        14px 18px;

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

      background:
        linear-gradient(
          180deg,
          #fff,
          #e9ddff
        );

      color:
        #211631;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.22);
    }


    button:active{

      transform:
        scale(.98);
    }



    /* 状态框 */

    .status{

      min-height:
        88px;

      border-radius:
        18px;

      padding:
        14px 15px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.09);

      font-size:
        14px;

      line-height:
        1.7;

      color:
        #ece5f7;
    }


    .status strong{

      font-size:
        17px;

      color:
        white;
    }



    .tiny{

      font-size:
        12px;

      color:
        #a9a0b7;

      margin-top:
        12px;

      text-align:
        center;
    }



    /* 愿望记录 */

    .history{

      margin-top:
        16px;
    }


    .history-title{

      font-size:
        13px;

      color:
        #cfc4df;

      margin-bottom:
        8px;
    }


    .wish-item{

      padding:
        10px 12px;

      border-radius:
        14px;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid rgba(255,255,255,.07);

      margin-top:
        8px;

      font-size:
        13px;

      color:
        #e8e1f2;
    }


    .wish-item small{

      display:block;

      color:
        #9f95ae;

      margin-top:
        4px;
    }


    .clear{

      display:block;

      margin:
        10px auto 0;

      background:
        transparent;

      color:
        #aaa;

      border:
        0;

      box-shadow:
        none;

      padding:
        6px 10px;

      font-size:
        12px;
    }



    /* 施法状态 */

    .casting .circle{

      box-shadow:

        0 0 55px
        rgba(214,184,255,.65),

        inset 0 0 40px
        rgba(214,184,255,.22);

      transform:
        scale(1.02);
    }



    /* 粒子 */

    .spark{

      position:
        fixed;

      width:
        6px;

      height:
        6px;

      border-radius:
        50%;

      background:
        white;

      pointer-events:
        none;

      z-index:
        10;

      box-shadow:

        0 0 12px white,

        0 0 24px
        rgba(214,184,255,.8);

      animation:
        fly 1.4s ease-out forwards;
    }


    @keyframes fly{

      from{

        transform:
          translate(0,0) scale(1);

        opacity:
          1;
      }

      to{

        transform:
          translate(var(--x),var(--y)) scale(0);

        opacity:
          0;
      }
    }


  </style>
</head>


<body>


<div class="stars"></div>


<div class="wrap">


  <div class="card" id="card">


    <h1>
      ✦ 许愿魔法阵 ✦
    </h1>


    <div class="sub">

      想许什么就写什么。

      每次点下去，都算一次正式施法。

    </div>



    <div class="circle-wrap">


      <div class="circle" id="circle">


        <div class="ring"></div>

        <div class="ring2"></div>


        <div class="orbit">

          <span>✦</span>

          <span>✧</span>

          <span>✦</span>

          <span>✧</span>

        </div>


        <div class="sigil">

          ✶

        </div>


      </div>


    </div>



    <div class="field">


      <input
        id="wish"
        maxlength="80"
        placeholder="例如：HAN · AB组 · 末场 · 观礼中选"
      />


      <button id="cast">

        施法

      </button>


    </div>



    <div
      class="status"
      id="status"
    >

      魔法阵待机中。

      <br>

      写下愿望，然后按「施法」。

    </div>



    <div
      class="history"
      id="historyWrap"
    >


      <div class="history-title">

        最近封印的愿望

      </div>


      <div id="history"></div>


      <button
        class="clear"
        id="clear"
      >

        清空记录

      </button>


    </div>


    <div class="tiny">

      纯玄学小页面，不连接任何真实应募系统。

    </div>


  </div>


</div>


<script>


const wishInput =
  document.getElementById("wish");


const castBtn =
  document.getElementById("cast");


const statusBox =
  document.getElementById("status");


const card =
  document.getElementById("card");


const historyBox =
  document.getElementById("history");


const clearBtn =
  document.getElementById("clear");



const steps = [

  "正在连接命运节点……",

  "正在绕过焦虑与坏运气……",

  "正在注入第一次应募保护……",

  "正在锁定愿望坐标……",

  "正在封印结果……"

];



function sleep(ms){

  return new Promise(

    resolve =>
      setTimeout(resolve, ms)

  );

}



function sparkBurst(){

  const rect =
    document
      .getElementById("circle")
      .getBoundingClientRect();


  const cx =
    rect.left +
    rect.width / 2;


  const cy =
    rect.top +
    rect.height / 2;


  for(
    let i = 0;
    i < 28;
    i++
  ){

    const spark =
      document.createElement("div");


    spark.className =
      "spark";


    spark.style.left =
      cx + "px";


    spark.style.top =
      cy + "px";


    const angle =
      Math.random() *
      Math.PI *
      2;


    const distance =
      70 +
      Math.random() *
      160;


    spark.style.setProperty(

      "--x",

      Math.cos(angle) *
      distance +
      "px"

    );


    spark.style.setProperty(

      "--y",

      Math.sin(angle) *
      distance +
      "px"

    );


    document.body.appendChild(
      spark
    );


    setTimeout(

      () => spark.remove(),

      1500

    );

  }

}



function loadHistory(){

  const items =
    JSON.parse(
      localStorage.getItem(
        "wishHistory"
      ) || "[]"
    );


  historyBox.innerHTML =
    "";


  if(!items.length){

    historyBox.innerHTML =
      `
      <div class="wish-item">
        还没有记录。
      </div>
      `;

    return;

  }


  items
    .slice(0,5)
    .forEach(item => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "wish-item";


      div.innerHTML =
        `
        ${escapeHtml(item.text)}

        <small>

          ${item.time}

        </small>
        `;


      historyBox.appendChild(
        div
      );

    });

}



function escapeHtml(text){

  return text.replace(

    /[&<>"']/g,

    character => ({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[character])

  );

}



function saveWish(text){

  const items =
    JSON.parse(
      localStorage.getItem(
        "wishHistory"
      ) || "[]"
    );


  items.unshift({

    text:text,

    time:
      new Date()
        .toLocaleString()

  });


  localStorage.setItem(

    "wishHistory",

    JSON.stringify(
      items.slice(0,20)
    )

  );


  loadHistory();

}



async function castSpell(){

  const wish =
    wishInput.value.trim();


  if(!wish){

    statusBox.innerHTML =
      `
      先写愿望啦。

      <br>

      魔法阵不能对着空气乱施法。
      `;


    wishInput.focus();


    return;

  }


  castBtn.disabled =
    true;


  card.classList.add(
    "casting"
  );


  for(
    const step
    of steps
  ){

    statusBox.innerHTML =
      step;


    await sleep(
      650
    );

  }


  sparkBurst();


  statusBox.innerHTML =
    `
    <strong>

      ✦ 愿望已封印 ✦

    </strong>

    <br>

    「${escapeHtml(wish)}」

    <br>

    今日施法完成。

    剩下的交给好运。
    `;


  saveWish(
    wish
  );


  card.classList.remove(
    "casting"
  );


  castBtn.disabled =
    false;

}



castBtn.addEventListener(

  "click",

  castSpell

);



wishInput.addEventListener(

  "keydown",

  event => {

    if(
      event.key ===
      "Enter"
    ){

      castSpell();

    }

  }

);



clearBtn.addEventListener(

  "click",

  () => {

    localStorage.removeItem(
      "wishHistory"
    );


    loadHistory();

  }

);



wishInput.value =
  "HAN · AB组 · 末场 · 观礼中选";


loadHistory();


</script>


</body>
</html>
