<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10091f">

<title>沈叙的许愿魔法阵 · Constellation</title>

<style>
:root{
  --bg1:#07050f;
  --bg2:#17102c;

  --text:#faf7ff;
  --muted:#bbb1c8;

  --accent:#d7bdff;
  --accent-soft:rgba(215,189,255,.18);

  --glass:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.13);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    sans-serif;

  color:var(--text);

  padding:
    calc(18px + env(safe-area-inset-top))
    15px
    calc(32px + env(safe-area-inset-bottom));

  overflow-x:hidden;

  background:
    radial-gradient(
      circle at 50% 0%,
      var(--accent-soft),
      transparent 30%
    ),

    radial-gradient(
      circle at 15% 80%,
      rgba(84,124,255,.11),
      transparent 30%
    ),

    linear-gradient(
      160deg,
      var(--bg2),
      var(--bg1) 68%
    );

  transition:
    background 1s ease;
}


/* 星空 */

.sky{
  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:0;

  overflow:hidden;
}

.stars{
  position:absolute;
  inset:-120px;

  background-image:

    radial-gradient(
      circle,
      rgba(255,255,255,.95) 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle,
      rgba(255,255,255,.45) 1px,
      transparent 1.5px
    );

  background-size:
    72px 72px,
    121px 121px;

  background-position:
    0 0,
    33px 17px;

  opacity:.14;

  animation:
    starDrift 28s linear infinite;
}

@keyframes starDrift{

  to{
    transform:
      translateY(72px);
  }

}


/* 星河隐藏模式 */

body.galaxy{

  background:

    radial-gradient(
      circle at 50% 0%,
      rgba(171,122,255,.35),
      transparent 34%
    ),

    radial-gradient(
      circle at 12% 70%,
      rgba(52,126,255,.24),
      transparent 34%
    ),

    radial-gradient(
      circle at 90% 50%,
      rgba(255,129,232,.15),
      transparent 28%
    ),

    linear-gradient(
      155deg,
      #180d34,
      #05040d 70%
    );
}

body.galaxy .stars{
  opacity:.28;
}


/* 主容器 */

.app{
  width:min(500px,100%);

  margin:auto;

  position:relative;

  z-index:2;
}


/* 顶部 */

.hero{
  text-align:center;

  margin:
    4px 0 14px;
}

.hero h1{
  margin:0;

  font-size:
    24px;

  letter-spacing:
    .04em;

  cursor:pointer;

  user-select:none;
}

.hero p{
  margin:
    6px 0 0;

  color:
    var(--muted);

  font-size:
    12px;
}


/* 面板 */

.panel{
  border:
    1px solid var(--line);

  border-radius:
    28px;

  padding:
    19px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.04)
    );

  box-shadow:
    0 24px 75px rgba(0,0,0,.40),
    inset 0 1px 0 rgba(255,255,255,.10);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);
}


/* 分类 */

.category-row{
  display:flex;

  gap:
    7px;

  overflow-x:auto;

  scrollbar-width:none;

  padding:
    2px 0 13px;
}

.category-row::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:
    0 0 auto;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:
    999px;

  padding:
    9px 13px;

  background:
    rgba(255,255,255,.045);

  color:
    #ddd6e7;

  font-size:
    12px;

  font-weight:
    650;

  cursor:
    pointer;

  transition:
    .25s ease;
}

.cat.active{
  background:
    linear-gradient(
      180deg,
      #ffffff,
      #eee3ff
    );

  color:
    #24172e;

  transform:
    translateY(-1px);

  box-shadow:
    0 7px 22px rgba(0,0,0,.20);
}


/* 魔法阵 */

.magic-zone{
  min-height:
    300px;

  display:grid;

  place-items:center;

  position:relative;

  overflow:visible;
}

.magic-circle{
  width:
    246px;

  height:
    246px;

  border-radius:
    50%;

  display:grid;

  place-items:center;

  position:relative;

  border:
    1px solid rgba(255,255,255,.40);

  box-shadow:
    0 0 40px var(--accent-soft),
    inset 0 0 45px rgba(255,255,255,.055);

  transition:
    .45s ease;
}

.magic-circle::before,
.magic-circle::after{
  content:"";

  position:absolute;

  border-radius:
    50%;

  pointer-events:none;
}

.magic-circle::before{
  inset:
    19px;

  border:
    1px solid rgba(255,255,255,.20);
}

.magic-circle::after{
  inset:
    42px;

  border:
    1px dashed rgba(255,255,255,.24);

  animation:
    spin 15s linear infinite;
}

.ring{
  position:absolute;

  border-radius:
    50%;

  pointer-events:none;
}

.ring.one{
  inset:
    -12px;

  border:
    1px dashed rgba(255,255,255,.44);

  animation:
    spin 18s linear infinite;
}

.ring.two{
  inset:
    31px;

  border:
    1px solid rgba(255,255,255,.11);

  animation:
    spinReverse 11s linear infinite;
}

.ring.three{
  inset:
    61px;

  border:
    1px dotted rgba(255,255,255,.22);

  animation:
    spin 8s linear infinite;
}

@keyframes spin{

  to{
    transform:
      rotate(360deg);
  }

}

@keyframes spinReverse{

  to{
    transform:
      rotate(-360deg);
  }

}


/* 外圈星星 */

.orbit{
  position:absolute;

  inset:0;

  animation:
    spin 10s linear infinite;
}

.orbit span{
  position:absolute;

  font-size:
    18px;

  text-shadow:
    0 0 14px var(--accent);
}

.orbit span:nth-child(1){
  left:
    50%;

  top:
    -10px;

  transform:
    translateX(-50%);
}

.orbit span:nth-child(2){
  right:
    -9px;

  top:
    50%;

  transform:
    translateY(-50%);
}

.orbit span:nth-child(3){
  left:
    50%;

  bottom:
    -10px;

  transform:
    translateX(-50%);
}

.orbit span:nth-child(4){
  left:
    -9px;

  top:
    50%;

  transform:
    translateY(-50%);
}


/* 符文 */

.rune{
  position:absolute;

  font-size:
    10px;

  letter-spacing:
    .24em;

  color:
    rgba(241,233,255,.75);

  text-transform:
    uppercase;
}

.rune.top{
  top:
    20px;
}

.rune.bottom{
  bottom:
    20px;

  transform:
    rotate(180deg);
}


/* 中心符号 */

.sigil{
  position:relative;

  z-index:4;

  font-size:
    62px;

  text-shadow:
    0 0 14px #fff,
    0 0 35px var(--accent),
    0 0 65px var(--accent);

  animation:
    breathe 2.5s ease-in-out infinite;

  transition:
    .35s ease;
}

@keyframes breathe{

  50%{
    transform:
      scale(1.09);

    filter:
      brightness(1.18);
  }

}


/* 陪伴 / 羁绊专属双星 */

.bond-stars{
  position:absolute;

  width:
    100px;

  height:
    100px;

  display:none;

  z-index:3;

  animation:
    spin 5s linear infinite;
}

.bond-stars.active{
  display:block;
}

.bond-star{
  position:absolute;

  width:
    10px;

  height:
    10px;

  border-radius:
    50%;

  background:
    white;

  box-shadow:
    0 0 10px white,
    0 0 24px var(--accent);
}

.bond-star.a{
  left:
    0;

  top:
    45px;
}

.bond-star.b{
  right:
    0;

  top:
    45px;
}


/* 输入区域 */

.wish-box{
  display:flex;

  gap:
    9px;
}

#wishInput{
  flex:
    1;

  min-width:
    0;

  border:
    1px solid rgba(255,255,255,.14);

  border-radius:
    16px;

  background:
    rgba(0,0,0,.18);

  color:
    white;

  outline:none;

  padding:
    14px;

  font-size:
    16px;
}

#wishInput::placeholder{
  color:
    #9990a4;
}

#wishInput:focus{
  border-color:
    var(--accent);

  box-shadow:
    0 0 0 3px var(--accent-soft);
}

#castBtn{
  border:0;

  border-radius:
    16px;

  padding:
    13px 18px;

  background:
    linear-gradient(
      180deg,
      #fff,
      #eaddff
    );

  color:
    #21162c;

  font-size:
    15px;

  font-weight:
    800;

  cursor:pointer;

  box-shadow:
    0 8px 23px rgba(0,0,0,.22);

  transition:
    .2s ease;
}

#castBtn:active{
  transform:
    scale(.97);
}


/* 施法状态 */

.status{
  min-height:
    100px;

  margin-top:
    12px;

  border:
    1px solid rgba(255,255,255,.075);

  border-radius:
    18px;

  background:
    rgba(255,255,255,.04);

  padding:
    14px;

  color:
    #eee8f5;

  font-size:
    14px;

  line-height:
    1.7;
}

.status strong{
  font-size:
    18px;

  color:
    white;
}

.fortune{
  margin-top:
    7px;

  color:
    var(--accent);
}


/* 数据统计 */

.stats{
  margin-top:
    12px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:
    8px;
}

.stat{
  padding:
    11px 8px;

  text-align:center;

  border:
    1px solid rgba(255,255,255,.065);

  border-radius:
    15px;

  background:
    rgba(255,255,255,.035);
}

.stat b{
  display:block;

  font-size:
    18px;
}

.stat span{
  font-size:
    10px;

  color:
    #aaa0b5;
}


/* 愿望历史 */

.history{
  margin-top:
    19px;
}

.history-header{
  display:flex;

  justify-content:
    space-between;

  align-items:center;

  margin-bottom:
    8px;
}

.history-title{
  font-size:
    13px;

  color:
    #d4ccdd;
}

.clear-btn{
  border:0;

  background:
    transparent;

  color:
    #968da2;

  font-size:
    11px;

  cursor:pointer;
}


/* 单条愿望 */

.wish-item{
  position:relative;

  margin-top:
    8px;

  padding:
    12px 44px 12px 12px;

  border:
    1px solid rgba(255,255,255,.065);

  border-radius:
    16px;

  background:
    rgba(255,255,255,.04);

  transition:
    .25s ease;
}

.wish-item.pinned{
  border-color:
    var(--accent);

  box-shadow:
    0 0 20px var(--accent-soft);
}

.wish-item.done{
  opacity:
    .65;
}

.wish-item.done .wish-text{
  text-decoration:
    line-through;
}

.wish-category{
  font-size:
    10px;

  color:
    var(--accent);

  margin-bottom:
    4px;
}

.wish-text{
  font-size:
    13px;

  line-height:
    1.55;
}

.wish-time{
  margin-top:
    5px;

  font-size:
    10px;

  color:
    #958b9f;
}

.wish-actions{
  margin-top:
    9px;

  display:flex;

  gap:
    6px;

  flex-wrap:
    wrap;
}

.action-btn{
  border:
    1px solid rgba(255,255,255,.08);

  border-radius:
    999px;

  background:
    rgba(255,255,255,.045);

  color:
    #c9c1d1;

  padding:
    5px 8px;

  font-size:
    10px;

  cursor:pointer;
}

.delete-btn{
  position:absolute;

  top:
    50%;

  right:
    9px;

  transform:
    translateY(-50%);

  border:
    0;

  background:
    transparent;

  color:
    #8d8495;

  font-size:
    18px;

  cursor:pointer;
}


/* 页脚 */

.footer{
  margin-top:
    15px;

  text-align:center;

  color:
    #8f8799;

  font-size:
    10px;
}


/* 施法发光 */

.casting .magic-circle{
  transform:
    scale(1.04);

  box-shadow:
    0 0 70px var(--accent),
    inset 0 0 60px var(--accent-soft);
}


/* 闪光 */

.flash{
  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:50;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.55),
      transparent 38%
    );

  animation:
    flash .9s ease-out forwards;
}

@keyframes flash{

  0%{
    opacity:0;
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}


/* 粒子 */

.spark{
  position:fixed;

  width:
    6px;

  height:
    6px;

  border-radius:
    50%;

  background:
    white;

  pointer-events:none;

  z-index:60;

  box-shadow:
    0 0 12px white,
    0 0 22px var(--accent);

  animation:
    sparkFly 1.5s ease-out forwards;
}

@keyframes sparkFly{

  from{
    transform:
      translate(0,0) scale(1);

    opacity:
      1;
  }

  to{
    transform:
      translate(var(--x),var(--y)) scale(0);

    opacity:
      0;
  }

}


/* 扩散波 */

.ripple{
  position:absolute;

  width:
    20px;

  height:
    20px;

  border-radius:
    50%;

  border:
    1px solid white;

  pointer-events:none;

  animation:
    ripple 1.5s ease-out forwards;
}

@keyframes ripple{

  from{
    transform:
      scale(1);

    opacity:
      1;
  }

  to{
    transform:
      scale(14);

    opacity:
      0;
  }

}


/* 流星 */

.shooting-star{
  position:fixed;

  width:
    3px;

  height:
    3px;

  border-radius:
    50%;

  background:
    white;

  box-shadow:
    0 0 9px white;

  z-index:1;

  pointer-events:none;

  animation:
    shooting 1.3s linear forwards;
}

.shooting-star::after{
  content:"";

  position:absolute;

  width:
    110px;

  height:
    1px;

  right:
    0;

  top:
    1px;

  background:
    linear-gradient(
      to left,
      white,
      transparent
    );
}

@keyframes shooting{

  0%{
    opacity:0;

    transform:
      translate(0,0) rotate(-25deg);
  }

  15%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(-260px,160px) rotate(-25deg);
  }

}


/* 羁绊特殊施法 */

.bond-burst{
  position:fixed;

  width:
    12px;

  height:
    12px;

  border-radius:
    50%;

  background:
    white;

  z-index:
    70;

  pointer-events:none;

  box-shadow:
    0 0 16px white,
    0 0 32px #f2bfff;

  animation:
    bondMerge 1.7s ease-in-out forwards;
}

@keyframes bondMerge{

  0%{
    transform:
      translate(var(--sx),var(--sy));

    opacity:
      1;
  }

  70%{
    transform:
      translate(0,0);

    opacity:
      1;
  }

  100%{
    transform:
      translate(0,0) scale(2.5);

    opacity:
      0;
  }

}


/* Toast */

.toast{
  position:fixed;

  left:
    50%;

  bottom:
    calc(28px + env(safe-area-inset-bottom));

  transform:
    translateX(-50%) translateY(20px);

  padding:
    10px 14px;

  border-radius:
    999px;

  background:
    rgba(18,12,28,.90);

  border:
    1px solid rgba(255,255,255,.12);

  color:
    white;

  font-size:
    12px;

  z-index:
    100;

  opacity:
    0;

  animation:
    toast .35s ease forwards;
}

@keyframes toast{

  to{
    opacity:1;

    transform:
      translateX(-50%) translateY(0);
  }

}


@media(max-width:390px){

  .magic-circle{
    width:
      218px;

    height:
      218px;
  }

  .magic-zone{
    min-height:
      270px;
  }

  .stats{
    gap:
      6px;
  }

}
</style>
</head>


<body>

<div class="sky">
  <div class="stars"></div>
</div>


<div class="app">

  <div class="hero">

    <h1 id="secretTitle">
      ✦ 沈叙的许愿魔法阵 ✦
    </h1>

    <p>
      Constellation · 愿望会留在星星之间
    </p>

  </div>


  <div class="panel" id="panel">


    <div
      class="category-row"
      id="categoryRow"
    ></div>



    <div
      class="magic-zone"
      id="magicZone"
    >

      <div
        class="magic-circle"
        id="magicCircle"
      >

        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>


        <div class="orbit">

          <span>✦</span>
          <span>✧</span>
          <span>✦</span>
          <span>✧</span>

        </div>


        <div class="rune top">
          wish · seal · constellation
        </div>


        <div class="rune bottom">
          wish · seal · constellation
        </div>


        <div
          class="bond-stars"
          id="bondStars"
        >

          <div class="bond-star a"></div>
          <div class="bond-star b"></div>

        </div>


        <div
          class="sigil"
          id="sigil"
        >
          ✶
        </div>


      </div>

    </div>



    <div class="wish-box">

      <input
        id="wishInput"
        maxlength="120"
        placeholder="写下你的愿望…"
      >

      <button id="castBtn">
        施法
      </button>

    </div>



    <div
      class="status"
      id="status"
    >

      魔法阵待机中。

      <br>

      写下愿望，选择愿望类型，然后施法。

    </div>



    <div class="stats">

      <div class="stat">

        <b id="totalCount">
          0
        </b>

        <span>
          愿望
        </span>

      </div>


      <div class="stat">

        <b id="doneCount">
          0
        </b>

        <span>
          已实现
        </span>

      </div>


      <div class="stat">

        <b id="streakCount">
          0
        </b>

        <span>
          连续施法
        </span>

      </div>

    </div>



    <div class="history">


      <div class="history-header">

        <div class="history-title">
          我的星愿记录
        </div>


        <button
          class="clear-btn"
          id="clearBtn"
        >
          清空
        </button>

      </div>


      <div id="historyList"></div>


    </div>



    <div class="footer">

      愿望记录只保存在当前浏览器 ·
      不连接任何真实应募、票务或外部系统

    </div>


  </div>

</div>


<script>

/* ============================
   分类配置
============================ */

const categories = {

  "应募":{

    color:"#d8beff",
    sigil:"✶",

    ]
  },


  "抢票":{

    color:"#ffbfe2",
    sigil:"✧",

    fortunes:[
      "刷新顺利，卡顿退散。",
      "座位正在向你靠近。",
      "付款页面会为你打开。",
      "愿手速和运气同时在线。"
    ]
  },


  "学业":{
    emoji:"📖",
    color:"#a8ceff",
    sigil:"✦",

    fortunes:[
      "知识正在慢慢留下来。",
      "今天学会的东西不会白费。",
      "愿努力最后都有回声。",
      "一步一步，也算前进。"
    ]
  },


  "考试":{
    emoji:"📝",
    color:"#9ed9ff",
    sigil:"✥",

    fortunes:[
      "会的都考，蒙的都对。",
      "记忆会在需要的时候回来。",
      "好运和实力一起上线。",

/* ============================
   DOM
============================ */

const categoryRow =
  document.getElementById("categoryRow");

const wishInput =
  document.getElementById("wishInput");

const castBtn =
  document.getElementById("castBtn");

const panel =
  document.getElementById("panel");

const magicCircle =
  document.getElementById("magicCircle");

const magicZone =
  document.getElementById("magicZone");

const sigil =
  document.getElementById("sigil");

const bondStars =
  document.getElementById("bondStars");

const statusBox =
  document.getElementById("status");

const historyList =
  document.getElementById("historyList");

  document.getElementById("totalCount");

const doneCount =
  document.getElementById("doneCount");

const streakCount =
  document.getElementById("streakCount");

const clearBtn =

const secretTitle =
  document.getElementById("secretTitle");


let currentCategory =

/* ============================
   工具
============================ */

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}


function escapeHtml(text){

  return text.replace(

    /[&<>"']/g,

    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])

  );

}


function formatTime(){

  return new Date()
    .toLocaleString(
      "zh-CN",
      {
        hour12:false
      }
    );

}


function showToast(text){

  const toast =
    document.createElement("div");

  toast.className =
    "toast";

  toast.textContent =
    text;

  document.body.appendChild(
    toast
  );


  setTimeout(
    () => toast.remove(),
    1800
  );

}


/* ============================
   分类按钮
============================ */

function buildCategories(){

  categoryRow.innerHTML =
    "";


  Object.entries(categories)
    .forEach(
      ([name,data]) => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "cat";


        if(
          name === currentCategory
        ){

          button.classList.add(
            "active"
          );

        }


        button.innerHTML =
          `${data.emoji} ${name}`;


        button.addEventListener(
          "click",
          () => {

            selectCategory(
              name
            );

          }
        );


        categoryRow.appendChild(
          button
        );

      }
    );

}


function selectCategory(name){

  currentCategory =
    name;


  const config =
    categories[name];


  document.documentElement
    .style
    .setProperty(
      "--accent",
      config.color
    );


  document.documentElement
    .style
    .setProperty(
      "--accent-soft",
      config.color + "30"
    );


  sigil.textContent =
    config.sigil;


  bondStars
    .classList
    .toggle(
      "active",
      name === "陪伴"
    );


  [
    ...document.querySelectorAll(
      ".cat"
    )
  ].forEach(
    button => {

      button.classList.remove(
        "active"
      );

      if(
        button.textContent.includes(
          name
        )
      ){

        button.classList.add(
          "active"
        );

      }

    }
  );

}


/* ============================
   本地数据
============================ */

function getWishes(){

  return JSON.parse(

    localStorage.getItem(
      "constellationWishes"
    ) || "[]"

  );

}


function saveWishes(list){

  localStorage.setItem(

    "constellationWishes",

    JSON.stringify(
      list.slice(0,100)
    )

  );

}


/* ============================
   连续施法
============================ */

function updateStreak(){

  const key =
    "constellationDays";


  let days =
    JSON.parse(
      localStorage.getItem(
        key
      ) || "[]"
    );


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  if(
    !days.includes(today)
  ){

    days.push(today);

    days =
      days.slice(-120);


    localStorage.setItem(

      key,

      JSON.stringify(days)

    );

  }


  let streak =
    0;


  let date =
    new Date();


  for(
    let i = 0;
    i < 120;
    i++
  ){

    const day =
      date
        .toISOString()
        .slice(0,10);


    if(
      days.includes(day)
    ){

      streak++;

      date.setDate(
        date.getDate() - 1
      );

    }

    else{

      break;

    }

  }


  streakCount.textContent =
    streak;

}


/* ============================
   渲染愿望
============================ */

function renderWishes(){

  const wishes =
    getWishes();


  const sorted =
    [...wishes]
      .sort(
        (a,b) => {

          if(
            a.pinned === b.pinned
          ){

            return 0;

          }

          return a.pinned
            ? -1
            : 1;

        }
      );


  totalCount.textContent =
    wishes.length;


  doneCount.textContent =
    wishes.filter(
      item => item.done
    ).length;


  historyList.innerHTML =
    "";


  if(
    !sorted.length
  ){

    historyList.innerHTML =
      `
      <div class="wish-item">

        还没有愿望记录。

      </div>
      `;

    return;

  }


  sorted
    .slice(0,15)
    .forEach(
      wish => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "wish-item";


        if(wish.pinned){

          item.classList.add(
            "pinned"
          );

        }


        if(wish.done){

          item.classList.add(
            "done"
          );

        }


        item.innerHTML =
          `

          <div class="wish-category">

            ${
              categories[wish.category]
                ?.emoji || "🌙"
            }

            ${escapeHtml(
              wish.category
            )}

          </div>


          <div class="wish-text">

            ${escapeHtml(
              wish.text
            )}

          </div>


          <div class="wish-time">

            ${escapeHtml(
              wish.time
            )}

          </div>


          <div class="wish-actions">

            <button
              class="action-btn pin"
            >

              ${
                wish.pinned
                ? "取消置顶"
                : "📌 置顶"
              }

            </button>


            <button
              class="action-btn done"
            >

              ${
                wish.done
                ? "↩️ 取消实现"
                : "✨ 已实现"
              }

            </button>

          </div>


          <button
            class="delete-btn"
          >

            ×

          </button>

          `;


        item
          .querySelector(
            ".pin"
          )
          .addEventListener(
            "click",
            () => {

              togglePin(
                wish.id
              );

            }
          );


        item
          .querySelector(
            ".done"
          )
          .addEventListener(
            "click",
            () => {

              toggleDone(
                wish.id
              );

            }
          );


        item
          .querySelector(
            ".delete-btn"
          )
          .addEventListener(
            "click",
            () => {

              deleteWish(
                wish.id
              );

            }
          );


        historyList.appendChild(
          item
        );

      }
    );

}


/* ============================
   愿望操作
============================ */

function togglePin(id){

  const list =
    getWishes();


  const wish =
    list.find(
      item =>
        item.id === id
    );


  if(!wish)return;


  wish.pinned =
    !wish.pinned;


  saveWishes(list);

  renderWishes();

}


function toggleDone(id){

  const list =
    getWishes();


  const wish =
    list.find(
      item =>
        item.id === id
    );


  if(!wish)return;


  wish.done =
    !wish.done;


  saveWishes(list);

  renderWishes();


  if(wish.done){

    showToast(
      "✦ 一颗星星亮起来了"
    );

  }

}


function deleteWish(id){

  const list =
    getWishes()
      .filter(
        item =>
          item.id !== id
      );


  saveWishes(list);

  renderWishes();

}


/* ============================
   普通粒子爆发
============================ */

function sparkBurst(){

  const rect =
    magicCircle
      .getBoundingClientRect();


  const centerX =
    rect.left +
    rect.width / 2;


  const centerY =
    rect.top +
    rect.height / 2;


  const flash =
    document.createElement(
      "div"
    );


  flash.className =
    "flash";


  document.body.appendChild(
    flash
  );


  setTimeout(
    () => flash.remove(),
    1000
  );


  const ripple =
    document.createElement(
      "div"
    );


  ripple.className =
    "ripple";


  ripple.style.left =
    rect.width / 2 - 10 + "px";


  ripple.style.top =
    rect.height / 2 - 10 + "px";


  magicCircle.appendChild(
    ripple
  );


  setTimeout(
    () => ripple.remove(),
    1600
  );


  for(
    let i = 0;
    i < 42;
    i++
  ){

    const spark =
      document.createElement(
        "div"
      );


    spark.className =
      "spark";


    spark.style.left =
      centerX + "px";


    spark.style.top =
      centerY + "px";


    const angle =
      Math.random()
      *
      Math.PI
      *
      2;


    const distance =
      80
      +
      Math.random()
      *
      220;


    spark.style.setProperty(

      "--x",

      Math.cos(angle)
      *
      distance
      +
      "px"

    );


    spark.style.setProperty(

      "--y",

      Math.sin(angle)
      *
      distance
      +
      "px"

    );


    document.body.appendChild(
      spark
    );


    setTimeout(

      () =>
        spark.remove(),

      1600

    );

  }


  spawnShootingStars(
    document.body.classList.contains(
      "galaxy"
    )
      ? 9
      : 4
  );

}


/* ============================
   流星
============================ */

function spawnShootingStars(
  amount = 4
){

  for(
    let i = 0;
    i < amount;
    i++
  ){

    setTimeout(
      () => {

        const star =
          document.createElement(
            "div"
          );


        star.className =
          "shooting-star";


        star.style.left =
          (
            window.innerWidth
            *
            (
              .35
              +
              Math.random()
              *
              .65
            )
          )
          +
          "px";


        star.style.top =
          (
            30
            +
            Math.random()
            *
            window.innerHeight
            *
            .35
          )
          +
          "px";


        document.body
          .appendChild(
            star
          );


        setTimeout(
          () =>
            star.remove(),
          1400
        );

      },

      i * 160

    );

  }

}


/* ============================
   羁绊专属双星合并特效
============================ */

function bondEffect(){

  const rect =
    magicCircle
      .getBoundingClientRect();


  const centerX =
    rect.left
    +
    rect.width / 2;


  const centerY =
    rect.top
    +
    rect.height / 2;


  [
    [-110,0],
    [110,0]

  ].forEach(
    ([x,y]) => {

      const star =
        document.createElement(
          "div"
        );


      star.className =
        "bond-burst";


      star.style.left =
        centerX - 6 + "px";


      star.style.top =
        centerY - 6 + "px";


      star.style.setProperty(
        "--sx",
        x + "px"
      );


      star.style.setProperty(
        "--sy",
        y + "px"
      );


      document.body.appendChild(
        star
      );


      setTimeout(
        () =>
          star.remove(),
        1800
      );

    }
  );

}


/* ============================
   施法
============================ */

async function castSpell(){

  const wish =
    wishInput
      .value
      .trim();


  if(!wish){

    statusBox.innerHTML =
      `
      先写愿望啦。

      <br>

      魔法阵不能对着空气乱施法。
      `;


    wishInput.focus();

    return;

  }


  castBtn.disabled =
    true;


  panel.classList.add(
    "casting"
  );


  const steps = [

    "正在读取愿望坐标……",

    `正在连接「${currentCategory}」星座节点……`,

    "正在清理坏运气与多余焦虑……",

    "正在寻找最亮的那颗星……",

    "正在封印愿望……"

  ];


  for(
    const step
    of steps
  ){

    statusBox.innerHTML =
      step;


    await sleep(
      520
    );

  }


  sparkBurst();


  if(
    currentCategory ===
    "陪伴"
  ){

    bondEffect();

  }


  const config =
    categories[
      currentCategory
    ];


  const fortune =
    config.fortunes[

      Math.floor(

        Math.random()
        *
        config.fortunes.length

      )

    ];


  statusBox.innerHTML =
    `

    <strong>

      ✦ 愿望已封印 ✦

    </strong>

    <br>

    「${escapeHtml(wish)}」

    <div class="fortune">

      ${escapeHtml(
        fortune
      )}

    </div>

    `;


  const wishes =
    getWishes();


  wishes.unshift({

    id:
      Date.now(),

    text:
      wish,

    category:
      currentCategory,

    time:
      formatTime(),

    pinned:
      false,

    done:
      false

  });


  saveWishes(
    wishes
  );


  updateStreak();

  renderWishes();


  panel.classList.remove(
    "casting"
  );


  castBtn.disabled =
    false;

}


/* ============================

============================ */

let secretTimer =
  null;


secretTitle.addEventListener(
  "click",
  () => {

    secretTapCount++;


    clearTimeout(
      secretTimer
    );


    secretTimer =
      setTimeout(
        () => {

          secretTapCount =
            0;

        },
        1800
      );


    if(
      secretTapCount >= 5
    ){

      secretTapCount =
        0;


      const active =
        !document.body
          .classList
          .contains(
            "galaxy"
          );


      document.body
        .classList
        .toggle(
          "galaxy",
          active
        );


      localStorage.setItem(

        active

          : "0"

      );

        showToast(
          "✦ 星河模式已开启 ✦"

        spawnShootingStars(

      }

    }

  }
);
